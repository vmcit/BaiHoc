# Spring Boot Application Configuration

# Server Port
server.port=8080

# MariaDB Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/my_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application Name
spring.application.name=BaiHoc

# JWT Configuration
jwt.secret=your_super_secret_key_should_be_at_least_256_bits_long_for_security_purposes_1234567890123456
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.root=INFO
logging.level.com.example.springboot=DEBUG

# ═══════════════════════════════════════════════════════
# Google OAuth2 Configuration
# ═══════════════════════════════════════════════════════
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OAuth2 redirect sau khi đăng nhập thành công (frontend URL nhận token)
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback

# OTP mock - inbox tại /api/auth/otp-inbox/{phone}
otp.webhook.url=http://localhost:9999/mock-sms-disabled
